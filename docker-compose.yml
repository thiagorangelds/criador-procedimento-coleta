# Sobe a API com os documentos num volume nomeado:
#
#   cp backend/.env.example backend/.env   # preencha CRIADOR_API_KEY e CRIADOR_API_TOKEN
#   docker compose up -d --build
#
# A imagem já traz o LibreOffice, então gera DOCX e PDF. Para uma imagem bem
# menor, só com DOCX: COM_LIBREOFFICE=false docker compose up -d --build

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        COM_LIBREOFFICE: "${COM_LIBREOFFICE:-true}"
    image: criador-procedimento:latest
    env_file:
      - path: backend/.env
        required: false
    environment:
      CRIADOR_HOST: "0.0.0.0"
      CRIADOR_PORTA: "8765"
      CRIADOR_PASTA_SAIDA: "/dados"
    ports:
      - "${CRIADOR_PORTA_HOST:-8765}:8765"
    volumes:
      - procedimentos:/dados
    restart: unless-stopped

volumes:
  procedimentos:
